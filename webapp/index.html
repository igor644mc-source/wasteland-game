<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Протокол: Пустошь</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <div class="stats-bar">
            <span>❤️ Здоровье: <b id="hp">100</b></span>
            <span>💧 Вода: <b id="water">50</b></span>
            <span>🎒 Лут: <b id="loot">0</b></span>
        </div>

        <div class="story-card">
            <p id="story-text">Загрузка...</p>
        </div>

        <div class="image-container">
            <img id="story-image" src="" alt="Иллюстрация сцены">
        </div>

        <div id="choices-container" class="choices-box"></div>
    </div>

    <script src="app.js"></script>
</body>
</html>
